<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b2b2b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Карточки English</title>
<style>
  :root { --bg:#2b2b2b; --card:#363636; --text:#fff; --head:#6cc4ff; --border:#bdbdbd; --ok:#3f8f5a; --no:#a04848; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,sans-serif;
         height:100dvh; overflow:hidden; display:flex; flex-direction:column; padding:16px; padding-bottom:calc(16px + env(safe-area-inset-bottom)); }
  h1 { color:var(--head); font-size:1.1rem; margin:0 0 4px; }
  #stats { font-size:.9rem; opacity:.8; margin-bottom:12px; }
  #stage { flex:1; min-height:0; display:flex; flex-direction:column; justify-content:center; max-width:480px; width:100%; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:16px; flex:1; min-height:0; overflow:auto;
          display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:12px; cursor:pointer; user-select:none; }
  .pic { font-size:5rem; line-height:1.1; } .pic img { max-width:100%; max-height:22dvh; max-width:100%; object-fit:contain; border-radius:12px; }
  .ru { font-size:1.35rem; margin-top:10px; }
  .en { font-size:1.4rem; margin-top:10px; color:var(--head); }
  .ipa { font-size:1rem; margin-top:4px; color:var(--border); }
  .snd { display:flex; gap:8px; margin-top:10px; }
  .hint { opacity:.6; font-size:.85rem; margin-top:8px; }
  .row { flex:none; display:flex; gap:10px; margin-top:12px; }
  button { flex:1; padding:16px; font-size:1.05rem; color:#fff; background:var(--card); border:1px solid var(--border); border-radius:12px; }
  button.ok { background:var(--ok); } button.no { background:var(--no); }
  .small { flex:0; padding:10px 14px; font-size:.85rem; }
  .done { text-align:center; } .done h2 { color:var(--head); }
  .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
  .nav { flex:none; display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .nav button { flex:none; padding:8px 22px; font-size:1.2rem; } .nav span { opacity:.8; }
  #list { position:fixed; inset:0; z-index:10; background:var(--bg); overflow:auto; padding:16px; display:none; }
  #list.open { display:block; } #list .wrap { max-width:480px; margin:0 auto; }
  .item { display:flex; gap:12px; align-items:center; padding:10px; margin-bottom:8px; background:var(--card);
          border:1px solid var(--border); border-radius:12px; cursor:pointer; }
  .item .th { width:48px; text-align:center; font-size:2rem; } .item img { width:48px; height:48px; object-fit:cover; border-radius:8px; vertical-align:middle; }
  .item .t { flex:1; } .item small { display:block; opacity:.7; margin-top:2px; }
  footer { flex:none; max-width:480px; width:100%; margin:12px auto 0; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
</style>
</head>
<body>
<div class="top"><h1>Карточки English</h1><button class="small" id="open-list">Список</button></div>
<div id="stats"></div>
<div id="stage"></div>
<footer>
  <button class="small" id="save">Сохранить прогресс</button>
  <button class="small" id="load">Загрузить прогресс</button>
  <input type="file" id="file" accept=".json" hidden>
</footer>
<div id="list"><div class="wrap"><div class="top"><h1>Все карточки</h1><button class="small" id="close-list">Закрыть</button></div><div id="items"></div></div></div>
<script src="cards.js"></script>
<script>
const KEY = "cards-progress-v1";
const DAY = 86400000;
const INTERVALS = [0, 1, 3, 7, 14, 30]; // дни по коробкам 0..5

function loadState() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } }
function saveState() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} }
let state = loadState();   // { id: { box, due } }

const $ = s => document.querySelector(s);
const stage = $("#stage");
let current = null, flipped = false;

function dueCards() {
  const now = Date.now();
  return CARDS.filter(c => !state[c.id] || state[c.id].due <= now)
              .sort((a, b) => ((state[a.id]?.due ?? 0) - (state[b.id]?.due ?? 0)) || (a.id - b.id));
}

function stats() {
  const learned = CARDS.filter(c => (state[c.id]?.box ?? 0) >= 3).length;
  $("#stats").textContent = `На сегодня: ${dueCards().length} · Выучено: ${learned} из ${CARDS.length}`;
}

function picHtml(c) {
  return `<div class="pic"><img src="img/${c.id}.jpg" alt="" onerror="this.replaceWith(document.createTextNode('${c.emoji}'))"></div>`;
}

function next() {
  stats();
  const due = dueCards();
  if (!due.length) {
    current = null;
    stage.innerHTML = `<div class="done"><h2>На сегодня всё 🎉</h2><p>Возвращайтесь завтра.</p></div>`;
    return;
  }
  // не показывать одну и ту же карточку подряд, если есть другие
  current = due.find(c => c !== current) || due[0];
  flipped = false;
  render();
}

function render() {
  const c = current;
  if (!flipped) {
    stage.innerHTML = navHtml() + `<div class="card" id="card">${picHtml(c)}<div class="ru">${c.ru}</div>
      <div class="hint">Вспомните вслух, потом нажмите на карточку</div></div>`;
    $("#card").onclick = () => { flipped = true; render(); play(c, false); };
  } else {
    stage.innerHTML = navHtml() + `<div class="card" id="card">${picHtml(c)}<div class="ru">${c.ru}</div>
      <div class="en">${c.en}</div><div class="ipa">${c.ipa}</div>
      <div class="snd"><button class="small" id="p1">🔊 Обычно</button><button class="small" id="p2">🐢 Медленно</button></div></div>
      <div class="row"><button class="no" id="no">Не знал</button><button class="ok" id="ok">Знал</button></div>`;
    $("#card").onclick = () => play(c, false);
    $("#p1").onclick = e => { e.stopPropagation(); play(c, false); };
    $("#p2").onclick = e => { e.stopPropagation(); play(c, true); };
    $("#ok").onclick = () => answer(true);
    $("#no").onclick = () => answer(false);
  }
  $("#prev").onclick = () => go(-1);
  $("#next").onclick = () => go(1);
}

function navHtml() {
  return `<div class="nav"><button id="prev">←</button><span>${CARDS.indexOf(current) + 1} / ${CARDS.length}</span><button id="next">→</button></div>`;
}

function go(d) {
  const i = CARDS.indexOf(current);
  current = CARDS[(i + d + CARDS.length) % CARDS.length];
  flipped = false;
  render();
}

function openList() {
  const now = Date.now();
  $("#items").innerHTML = CARDS.map(c => {
    const s = state[c.id];
    const status = !s ? "новая" : s.due <= now ? "пора повторить" : `повторить через ${Math.ceil((s.due - now) / DAY)} дн.`;
    return `<div class="item" data-id="${c.id}"><div class="th"><img src="img/${c.id}.jpg" alt="" onerror="this.replaceWith(document.createTextNode('${c.emoji}'))"></div>
      <div class="t">${c.id}. ${c.ru}<small>${status}</small></div></div>`;
  }).join("");
  $("#list").classList.add("open");
}

$("#open-list").onclick = openList;
$("#close-list").onclick = () => $("#list").classList.remove("open");
$("#items").onclick = e => {
  const it = e.target.closest(".item"); if (!it) return;
  current = CARDS.find(c => c.id === +it.dataset.id);
  flipped = false;
  $("#list").classList.remove("open");
  render();
};

function answer(known) {
  const s = state[current.id] || { box: 0, due: 0 };
  s.box = known ? Math.min(s.box + 1, INTERVALS.length - 1) : 0;
  // «не знал» вернётся в этой же сессии: due = сейчас, но не подряд
  s.due = known ? Date.now() + INTERVALS[s.box] * DAY : Date.now();
  state[current.id] = s;
  saveState();
  next();
}

let audio = null;

// Готовая озвучка из audio/; если файла нет — голос телефона
function play(c, slow) {
  try { speechSynthesis.cancel(); audio && audio.pause(); } catch {}
  fetch(`audio/${c.id}${slow ? "-slow" : ""}.mp3`)
    .then(r => { if (!r.ok) throw 0; return r.blob(); })
    .then(b => { audio = new Audio(URL.createObjectURL(b)); return audio.play(); })
    .catch(() => speak(c.en, slow));
}

function speak(text, slow) {
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = slow ? 0.6 : 0.8;
    speechSynthesis.speak(u);
  } catch {}
}

$("#save").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(state)], { type: "application/json" }));
  a.download = "cards-progress.json";
  a.click();
};
$("#load").onclick = () => $("#file").click();
$("#file").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { state = JSON.parse(await f.text()); saveState(); next(); } catch { alert("Не удалось прочитать файл"); }
};

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
next();
</script>
</body>
</html>
